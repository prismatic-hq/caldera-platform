[project]
name = "preview-cli"
version = "0.1.0"
description = "preview CLI: resolve feature groups and manage preview environments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43",
    "httpx>=0.28",
    "pyyaml>=6",
    "typer>=0.27",
]

[project.scripts]
preview = "preview_cli.main:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
