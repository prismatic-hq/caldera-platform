[project]
name = "caldera-cli"
version = "0.1.0"
description = "caldera CLI: resolve feature groups and manage vents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.27",
]

[project.scripts]
caldera = "caldera_cli.main:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
