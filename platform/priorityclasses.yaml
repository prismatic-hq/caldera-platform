apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preview-headroom
value: -10
preemptionPolicy: Never
globalDefault: false
description: Placeholder pods that hold spare capacity; any preview environment pod preempts them.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preview-environment
value: 100
globalDefault: false
description: Preview environment workloads (services, Postgres, E2E jobs).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: baseline
value: 1000
globalDefault: false
description: The long-lived dev environment built from main.
