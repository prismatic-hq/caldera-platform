suite: service deployments
templates:
  - templates/services.yaml
set:
  vent.name: quake-alerts
  services.tremor.image.tag: sha-a1b2c3d
  image.registry: registry.example
tests:
  - it: renders a Deployment and Service per service
    asserts:
      - hasDocuments:
          count: 4
  - it: runs the pushed image with vent priority and part-of label
    documentIndex: 2
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: tremor
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example/tremor-api:sha-a1b2c3d
      - equal:
          path: spec.template.spec.priorityClassName
          value: vent
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: vent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 2
  - it: labels every object as part of the vent
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: vent
