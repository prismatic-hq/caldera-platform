suite: vent name validation
templates:
  - templates/services.yaml
tests:
  - it: fails when the vent name is missing
    asserts:
      - failedTemplate:
          errorPattern: vent.name is required
  - it: fails on a vent name that is not a DNS label
    set:
      vent.name: Quake_Alerts
    asserts:
      - failedTemplate:
          errorPattern: invalid vent name "Quake_Alerts"
  - it: fails when a service hostname label exceeds 63 characters
    set:
      vent.name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: vent label too long
  - it: accepts the longest name that fits every label
    set:
      vent.name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - notFailedTemplate: {}
