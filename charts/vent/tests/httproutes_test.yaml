suite: http routes
values:
  - ../ci/default-values.yaml
templates:
  - templates/httproutes.yaml
set:
  environment.name: quake-alerts
  domain: preview.prismatic.dev
tests:
  - it: renders one route per service
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HTTPRoute
  - it: attaches to the shared gateway and is labeled for preview exposure
    asserts:
      - equal:
          path: spec.parentRefs[0]
          value:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: preview
            namespace: envoy-gateway-system
            sectionName: https
      - equal:
          path: metadata.labels["prismatic.dev/exposure"]
          value: preview
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: preview-environment
  - it: uses one hostname label under the preview domain
    documentSelector:
      path: metadata.name
      value: steward
    asserts:
      - equal:
          path: spec.hostnames
          value: ["steward-quake-alerts.preview.prismatic.dev"]
