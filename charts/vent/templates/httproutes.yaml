{{- $environment := include "preview.name" . }}
{{- range $name, $overrides := .Values.services }}
{{- $service := mustMergeOverwrite (deepCopy $.Values.serviceDefaults) $overrides }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "preview.labels" $ | nindent 4 }}
    {{- include "preview.selectorLabels" (dict "name" $name) | nindent 4 }}
    prismatic.dev/exposure: preview
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    - {{ printf "%s-%s.%s" $name $environment $.Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: {{ $service.port }}
{{- end }}
