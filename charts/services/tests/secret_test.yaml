suite: postgres credentials
templates:
  - templates/secret.yaml
set:
  environment.name: quake-alerts
tests:
  - it: exists before postgres and the migration Jobs that read it
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
  - it: keeps the password of an existing secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: postgres-credentials
            namespace: NAMESPACE
          data:
            password: ZXhpc3Rpbmc=
    asserts:
      - equal:
          path: data.password
          value: ZXhpc3Rpbmc=
