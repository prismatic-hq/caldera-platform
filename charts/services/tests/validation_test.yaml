suite: preview environment name validation
values:
  - ../ci/default-values.yaml
templates:
  - templates/services.yaml
tests:
  - it: fails when the preview environment name is missing
    set:
      environment.name: ""
    asserts:
      - failedTemplate:
          errorPattern: environment.name is required
  - it: fails on a preview environment name that is not a DNS label
    set:
      environment.name: Quake_Alerts
    asserts:
      - failedTemplate:
          errorPattern: invalid preview environment name "Quake_Alerts"
  - it: fails when a service hostname label exceeds 63 characters
    set:
      environment.name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: hostname label too long
  - it: accepts the longest name that fits every label
    set:
      environment.name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - notFailedTemplate: {}
