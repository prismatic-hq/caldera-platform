suite: services
values:
  - ../ci/default-values.yaml
templates:
  - templates/services.yaml
set:
  environment.name: quake-alerts
  services.tremor.image.tag: sha-a1b2c3d
  image.registry: registry.example
tests:
  - it: renders a Deployment, Service, HTTPRoute and gateway policy per service
    asserts:
      - hasDocuments:
          count: 8
  - it: passes the registry, image and database settings to each service
    documentIndex: 4
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: tremor
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example/tremor-api:sha-a1b2c3d
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: DB_HOST
            value: postgres
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.name
          value: postgres-credentials
  - it: labels every object with the environment
    asserts:
      - equal:
          path: metadata.labels["prismatic.dev/environment"]
          value: quake-alerts
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: quake-alerts
  - it: routes each service at <service>-<environment>.<domain> on the shared gateway
    set:
      domain: preview.prismatic.dev
    documentIndex: 2
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.hostnames
          value: ["steward-quake-alerts.preview.prismatic.dev"]
      - equal:
          path: spec.parentRefs[0].name
          value: preview
  - it: applies the environment kind, priority class and route labels when set
    set:
      environment.kind: preview
      priorityClassName: preview-environment
      routeLabels:
        prismatic.dev/exposure: preview
    asserts:
      - equal:
          path: metadata.labels["prismatic.dev/environment-kind"]
          value: preview
      - equal:
          path: spec.template.spec.priorityClassName
          value: preview-environment
        documentIndex: 0
      - equal:
          path: metadata.labels["prismatic.dev/exposure"]
          value: preview
        documentIndex: 2
  - it: renders every service in the values, not a fixed list
    set:
      services.magma.image.repository: magma-api
      services.magma.image.tag: sha-0f9e8d7
    asserts:
      - hasDocuments:
          count: 12
  - it: applies serviceDefaults and lets a service override its port
    set:
      services.steward.port: 8080
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
  - it: tells every service where the others are by in-cluster Service name
    set:
      services.steward.port: 8080
    documentIndex: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEWARD_URL
            value: http://steward:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TREMOR_URL
            value: http://tremor:8000
  - it: turns dashes in service names into underscores in URL variables
    set:
      services.magma-api.image.repository: magma-api
      services.magma-api.image.tag: main
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAGMA_API_URL
            value: http://magma-api:8000
  - it: rejects a service name that is not a DNS label
    set:
      services.Magma.image.repository: magma-api
      services.Magma.image.tag: main
    asserts:
      - failedTemplate:
          errorPattern: does not match pattern
