{{- $environment := include "services.environmentName" . }}
{{- $labels := include "services.labels" . | fromYaml }}
{{- $databaseEnv := list
  (dict "name" "DB_HOST" "value" "postgres")
  (dict "name" "DB_PORT" "value" "5432")
  (dict "name" "DB_NAME" "value" .Values.postgres.database)
  (dict "name" "DB_USER" "value" .Values.postgres.user)
  (dict "name" "DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" "postgres-credentials" "key" "password"))) }}
{{- range $name, $overrides := .Values.services }}
{{- $service := mustMergeOverwrite (deepCopy $.Values.serviceDefaults) $overrides }}
---
{{ include "service.manifests" (dict
  "name" $name
  "namespace" $.Release.Namespace
  "labels" $labels
  "image" (merge (dict "registry" $.Values.image.registry) $service.image)
  "pullPolicy" $.Values.image.pullPolicy
  "port" $service.port
  "resources" $service.resources
  "priorityClassName" $.Values.priorityClassName
  "env" $databaseEnv
  "route" (dict
    "enabled" true
    "hostname" (printf "%s-%s.%s" $name $environment $.Values.domain)
    "labels" $.Values.routeLabels
    "gateway" $.Values.gateway)) }}
{{- end }}
