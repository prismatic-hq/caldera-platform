{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-credentials" -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "services.labels" . | nindent 4 }}
  annotations:
    {{- include "services.hook" (dict "weight" -20) | nindent 4 }}
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
