environment:
  name: ""
  kind: ""

datasetVersion: latest
domain: preview.example.com
priorityClassName: ""
nodeSelector: {}
tolerations: []
routeLabels: {}

gateway:
  name: preview
  namespace: envoy-gateway-system
  sectionName: https

image:
  registry: ""
  pullPolicy: IfNotPresent

serviceDefaults:
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 256Mi
  migration:
    enabled: true
    command: ["alembic", "upgrade", "head"]
    timeoutSeconds: 180

services: {}

e2e:
  enabled: true
  image:
    repository: e2e
    tag: main
  timeoutSeconds: 240
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

postgres:
  image:
    repository: golden-db
    tag: ""
  database: prismatic
  user: prismatic
  uid: 10001
  memoryBacked: true
  sizeLimit: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
