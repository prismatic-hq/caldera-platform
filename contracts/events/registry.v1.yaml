version: 1
typePrefix: com.prismatichq
types:
  - type: vent.environment.requested.v1
    owner: caldera-platform
    producer: caldera CLI (vent up)
    consumers: [pr-commenter, cycle-time-dashboard]
    subject: vent/<name>
    schema: data/vent.environment.requested.v1.schema.json
    example: examples/vent.environment.requested.v1.json
    delivery: at-least-once
    status: planned
  - type: vent.environment.ready.v1
    owner: caldera-platform
    producer: caldera CLI (vent up)
    consumers: [pr-commenter, e2e-runner, cycle-time-dashboard]
    subject: vent/<name>
    schema: data/vent.environment.ready.v1.schema.json
    example: examples/vent.environment.ready.v1.json
    delivery: at-least-once
    status: planned
  - type: vent.environment.failed.v1
    owner: caldera-platform
    producer: caldera CLI (vent up)
    consumers: [pr-commenter, cycle-time-dashboard]
    subject: vent/<name>
    schema: data/vent.environment.failed.v1.schema.json
    example: examples/vent.environment.failed.v1.json
    delivery: at-least-once
    status: planned
  - type: vent.environment.cooled.v1
    owner: caldera-platform
    producer: caldera CLI (vent down)
    consumers: [pr-commenter, cycle-time-dashboard]
    subject: vent/<name>
    schema: data/vent.environment.cooled.v1.schema.json
    example: examples/vent.environment.cooled.v1.json
    delivery: at-least-once
    status: planned
  - type: data.golden.built.v1
    owner: caldera-platform
    producer: golden-image workflow
    consumers: [cycle-time-dashboard]
    subject: dataset/<dataset-version>
    schema: data/data.golden.built.v1.schema.json
    example: examples/data.golden.built.v1.json
    delivery: at-least-once
    status: planned
  - type: test.e2e.completed.v1
    owner: caldera-platform
    producer: E2E Job
    consumers: [pr-commenter, cycle-time-dashboard]
    subject: vent/<name>
    schema: data/test.e2e.completed.v1.schema.json
    example: examples/test.e2e.completed.v1.json
    delivery: at-least-once
    status: planned
