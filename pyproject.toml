[project]
name = "caldera-platform"
version = "0.1.0"
description = "AWS CDK app and GitOps platform for Prismatic HQ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.270.0,<3.0.0",
    "cdk-nag>=3.0.2,<4",
    "caldera-cli",
    "constructs>=10.5.0,<11.0.0",
    "golden-seeder",
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.38",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cli", "seeder"]

[tool.uv.sources]
caldera-cli = { workspace = true }
golden-seeder = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["caldera", "caldera_cli", "golden_seeder"]

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests", "seeder/tests", "e2e"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
