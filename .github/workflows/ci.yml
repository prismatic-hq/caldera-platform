name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.0
  HELM_UNITTEST_IMAGE: helmunittest/helm-unittest:4.2.3-1.1.2
  CT_IMAGE: quay.io/helmpack/chart-testing:v3.14.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked
      - run: npx --yes aws-cdk@2 synth --quiet -c env=sandbox.yaml
      - name: cdk-nag suppression count
        run: |
          jq -rs '[.[].Resources[]? | .Metadata.cdk_nag.rules_to_suppress[]?
            | select(.id | startswith("AwsSolutions-"))] | "cdk-nag suppressions: \(length)"' \
            cdk.out/*.template.json

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$CT_IMAGE"
          sh -c 'git config --global --add safe.directory "*" && ct lint --all --chart-dirs charts --target-branch main'

  chart-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/render_charts.py --dependencies-only
      - run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/apps" "$HELM_UNITTEST_IMAGE" charts/*

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Render chart examples and platform manifests
        run: uv run python scripts/render_charts.py --out rendered
      - run: docker run --rm -v "$PWD/rendered:/r" "$KUBECONFORM_IMAGE" -strict -summary -ignore-missing-schemas /r
      - run: docker run --rm -v "$PWD/rendered:/r" "$TRIVY_IMAGE" config --exit-code 1 /r

  runner-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: runner-access
      - name: Runner RBAC and admission policy on kind
        env:
          KIND_CONTEXT: kind-runner-access
        run: uv run pytest tests/integration -q

  e2e-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'prismatic-hq'
    needs: [lint, test]
    runs-on: caldera-platform-runners
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_NAME: e2e
      BUILD_CACHE_REPOSITORY: build-cache
    steps:
      - id: config
        name: Check workflow configuration
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "::error::$GITHUB_REPOSITORY is missing variable AWS_REGION. Set it at repository level; private repos on GitHub Free cannot read organization variables."
            exit 1
          fi
      - uses: actions/checkout@v7
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          repository="$REGISTRY/$IMAGE_NAME"
          tag="sha-${GITHUB_SHA::7}"
          if result=$(docker buildx imagetools inspect "$repository:$tag" 2>&1); then
            exists=true
          elif grep -qi "not found" <<<"$result"; then
            exists=false
          else
            echo "::error::cannot check $repository:$tag in ECR: $result"
            exit 1
          fi
          {
            echo "exists=$exists"
            echo "repository=$repository"
            echo "tag=$tag"
            echo "cache=$REGISTRY/$BUILD_CACHE_REPOSITORY:$IMAGE_NAME"
          } >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/e2e/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true
      - env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
        run: docker buildx imagetools create --tag "$REPOSITORY:main" "$REPOSITORY:$TAG"
