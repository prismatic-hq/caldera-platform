name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.0
  HELM_UNITTEST_IMAGE: helmunittest/helm-unittest:4.2.3-1.1.2
  CT_IMAGE: quay.io/helmpack/chart-testing:v3.14.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked
      - run: npx --yes aws-cdk@2 synth --quiet
        env:
          CALDERA_DOMAIN: example.com
      - name: cdk-nag suppression count
        run: |
          jq -rs '[.[].Resources[]? | .Metadata.cdk_nag.rules_to_suppress[]?
            | select(.id | startswith("AwsSolutions-"))] | "cdk-nag suppressions: \(length)"' \
            cdk.out/*.template.json

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$CT_IMAGE"
          sh -c 'git config --global --add safe.directory "*" && ct lint --all --chart-dirs charts --target-branch main'

  chart-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/render_charts.py --dependencies-only
      - run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/apps" "$HELM_UNITTEST_IMAGE" charts/*

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Render chart examples and platform manifests
        run: uv run python scripts/render_charts.py --out rendered
      - run: docker run --rm -v "$PWD/rendered:/r" "$KUBECONFORM_IMAGE" -strict -summary -ignore-missing-schemas /r
      - run: docker run --rm -v "$PWD/rendered:/r" "$TRIVY_IMAGE" config --exit-code 1 /r
