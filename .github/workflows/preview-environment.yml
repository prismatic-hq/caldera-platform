name: preview-environment

on:
  workflow_call:
    inputs:
      repo:
        description: Service repo that was pushed (tremor-api or steward-api)
        type: string
        required: true
      branch:
        type: string
        required: true
      sha:
        type: string
        required: true
      platform-ref:
        description: caldera-platform ref that provides the CLI and chart
        type: string
        default: main
      optimistic:
        description: Deploy before the image build; never cancelled, and leaves e2e and reporting to the build-gated deploy
        type: boolean
        default: false
    secrets:
      CALDERA_APP_CLIENT_ID:
        description: Client ID of the GitHub App that can read caldera-platform and both service repos
        required: true
      CALDERA_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true

permissions:
  contents: read
  checks: write
  deployments: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  HELM_VERSION: v4.3.0
  KUBECTL_VERSION: v1.35.0

jobs:
  up:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ github.event.repository.name }}-runners
    concurrency:
      group: preview-${{ inputs.optimistic && 'optimistic-' || '' }}${{ inputs.repo }}-${{ inputs.branch }}
      cancel-in-progress: ${{ !inputs.optimistic }}
    env:
      UV_NO_SYNC: "1"
    steps:
      - id: config
        name: Check workflow configuration
        env:
          CLIENT_ID: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$AWS_REGION" ] || missing+=("variable AWS_REGION")
          [ -n "$CLIENT_ID" ] || missing+=("secret CALDERA_APP_CLIENT_ID")
          [ -n "$PRIVATE_KEY" ] || missing+=("secret CALDERA_APP_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::$GITHUB_REPOSITORY is missing: ${missing[*]}. Set them at repository level; private repos on GitHub Free cannot read organization secrets or variables."
            exit 1
          fi
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
          owner: prismatic-hq
          repositories: caldera-platform,tremor-api,steward-api
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: preview-cli
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - run: uv sync --locked --package preview-cli --no-dev
      - id: deploy
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: uv run preview env up --repo "$REPO" --branch "$BRANCH" --sha "$SHA"
      - id: deployment
        name: Record the GitHub deployment
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.skipped != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ENVIRONMENT: ${{ steps.deploy.outputs.environment }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ inputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { recordDeployment } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-report.cjs`);
            await recordDeployment({ github, context });
      - id: e2e
        if: steps.deploy.outputs.exact-image == 'true' && !inputs.optimistic
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ steps.deploy.outputs.environment }}
        run: uv run preview env test --name "$ENVIRONMENT"
      - name: Report e2e check, URLs and timings
        if: always() && steps.deploy.outcome == 'success' && steps.deploy.outputs.skipped != 'true' && !inputs.optimistic
        uses: actions/github-script@v9.0.0
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_TIMINGS: ${{ steps.deploy.outputs.timings }}
          E2E_TIMINGS: ${{ steps.e2e.outputs.timings }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EXACT_IMAGE: ${{ steps.deploy.outputs.exact-image }}
          SHA: ${{ inputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { report } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-report.cjs`);
            await report({ github, context });
      - name: Fail the job when e2e failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
