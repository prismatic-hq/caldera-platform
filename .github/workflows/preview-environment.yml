name: preview-environment

on:
  workflow_call:
    inputs:
      repo:
        description: Service repo that was pushed (tremor-api or steward-api)
        type: string
        required: true
      branch:
        type: string
        required: true
      sha:
        type: string
        required: true
      platform-ref:
        description: caldera-platform ref that provides the CLI and chart
        type: string
        default: main
    secrets:
      CALDERA_TOKEN:
        description: Token that can read caldera-platform and both service repos
        required: false

permissions:
  contents: read
  checks: write
  deployments: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  HELM_VERSION: v4.3.0

jobs:
  resolve:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ github.event.repository.name }}-runners
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.CALDERA_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ secrets.CALDERA_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: plan
        env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env resolve --repo "$REPO" --branch "$BRANCH"

  up:
    needs: resolve
    runs-on: ${{ github.event.repository.name }}-runners
    concurrency:
      group: preview-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: true
    environment:
      name: preview-${{ needs.resolve.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      GITHUB_TOKEN: ${{ secrets.CALDERA_TOKEN || github.token }}
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ secrets.CALDERA_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: uv sync --locked
      - id: deploy
        env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: uv run preview env up --repo "$REPO" --branch "$BRANCH" --sha "$SHA"
      - id: e2e
        if: steps.deploy.outputs.exact-image == 'true'
        continue-on-error: true
        run: uv run preview env test --name "$ENVIRONMENT"
      - name: Report e2e check, URLs and timings
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/github-script@v9.0.0
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_TIMINGS: ${{ steps.deploy.outputs.timings }}
          E2E_TIMINGS: ${{ steps.e2e.outputs.timings }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          EXACT_IMAGE: ${{ steps.deploy.outputs.exact-image }}
          SHA: ${{ inputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { report } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-report.cjs`);
            await report({ github, context });
      - name: Fail the job when e2e failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
