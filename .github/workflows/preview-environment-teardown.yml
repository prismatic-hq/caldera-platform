name: preview-environment-teardown

on:
  workflow_call:
    inputs:
      repo:
        description: Service repo whose branch was deleted (tremor-api or steward-api)
        type: string
        required: true
      branch:
        type: string
        required: true
      platform-ref:
        description: caldera-platform ref that provides the CLI and chart
        type: string
        default: main
    secrets:
      CALDERA_APP_CLIENT_ID:
        description: Client ID of the GitHub App that can read caldera-platform and both service repos
        required: true
      CALDERA_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true

permissions:
  contents: read
  deployments: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  HELM_VERSION: v4.3.0
  KUBECTL_VERSION: v1.35.0

jobs:
  down:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ github.event.repository.name }}-runners
    concurrency:
      group: preview-teardown-${{ inputs.repo }}-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      UV_NO_SYNC: "1"
    steps:
      - id: config
        name: Check workflow configuration
        env:
          CLIENT_ID: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$AWS_REGION" ] || missing+=("variable AWS_REGION")
          [ -n "$CLIENT_ID" ] || missing+=("secret CALDERA_APP_CLIENT_ID")
          [ -n "$PRIVATE_KEY" ] || missing+=("secret CALDERA_APP_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::$GITHUB_REPOSITORY is missing: ${missing[*]}. Set them at repository level; private repos on GitHub Free cannot read organization secrets or variables."
            exit 1
          fi
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
          owner: prismatic-hq
          repositories: caldera-platform,tremor-api,steward-api
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: preview-cli
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - run: uv sync --locked --package preview-cli --no-dev
      - id: down
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env down --repo "$REPO" --branch "$BRANCH"
      - name: Mark the preview deployments inactive
        if: steps.down.outputs.action == 'down'
        uses: actions/github-script@v9.0.0
        env:
          ENVIRONMENT: ${{ steps.down.outputs.environment }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { deactivate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-report.cjs`);
            await deactivate({ github, context });
