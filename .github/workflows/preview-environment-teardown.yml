name: preview-environment-teardown

on:
  workflow_call:
    inputs:
      repo:
        description: Service repo whose branch was deleted (tremor-api or steward-api)
        type: string
        required: true
      branch:
        type: string
        required: true
      platform-ref:
        description: caldera-platform ref that provides the CLI and chart
        type: string
        default: main
    secrets:
      CALDERA_APP_CLIENT_ID:
        description: Client ID of the GitHub App that can read caldera-platform and both service repos
        required: true
      CALDERA_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  HELM_VERSION: v4.3.0
  KUBECTL_VERSION: v1.35.0

jobs:
  resolve:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ github.event.repository.name }}-runners
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
          owner: prismatic-hq
          repositories: caldera-platform,tremor-api,steward-api
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: plan
        env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env resolve --repo "$REPO" --branch "$BRANCH" --offline

  down:
    needs: resolve
    runs-on: ${{ github.event.repository.name }}-runners
    concurrency:
      group: preview-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.CALDERA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CALDERA_APP_PRIVATE_KEY }}
          owner: prismatic-hq
          repositories: caldera-platform,tremor-api,steward-api
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - run: uv sync --locked
      - env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env down --repo "$REPO" --branch "$BRANCH"
