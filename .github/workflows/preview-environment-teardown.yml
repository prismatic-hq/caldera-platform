name: preview-environment-teardown

on:
  workflow_call:
    inputs:
      repo:
        description: Service repo whose branch was deleted (tremor-api or steward-api)
        type: string
        required: true
      branch:
        type: string
        required: true
      platform-ref:
        description: caldera-platform ref that provides the CLI and chart
        type: string
        default: main
    secrets:
      CALDERA_TOKEN:
        description: Token that can read caldera-platform and both service repos
        required: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  HELM_VERSION: v4.3.0
  KUBECTL_VERSION: v1.35.0

jobs:
  resolve:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ github.event.repository.name }}-runners
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ secrets.CALDERA_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: plan
        env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env resolve --repo "$REPO" --branch "$BRANCH" --offline

  down:
    needs: resolve
    runs-on: ${{ github.event.repository.name }}-runners
    concurrency:
      group: preview-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.CALDERA_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: prismatic-hq/caldera-platform
          ref: ${{ inputs.platform-ref }}
          token: ${{ secrets.CALDERA_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - run: uv sync --locked
      - env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: uv run preview env down --repo "$REPO" --branch "$BRANCH"
